display_name: Plan Preview
short_description: 名指しで依頼された場合のみ、計画本文を一時HTML previewとして表示する / Render a plan as a temporary HTML preview, by-name invocation only.
default_prompt: plan-preview で計画を表示して / Invoke plan-preview by name
trigger_examples:
  - 名指しでの plan-preview 依頼のみ / explicit by-name invocation of plan-preview only
entrypoint: python3 -m scripts.html_review_workbench.cli
working_directory: plugin_root
workflow:
  - plan-preview
