display_name: Visual HTML Renderer
short_description: レビュー往復前提の reviewable HTML を生成する共通レンダラー / Shared renderer for reviewable HTML artifacts.
default_prompt: Make this a reviewable HTML document / レビュー可能なHTMLにして
trigger_examples:
  - レビュー可能なHTML
  - レビューHTML
  - コメントできるHTML
  - レビュー用にHTML化
  - reviewable HTML
  - make this a reviewable HTML document
entrypoint: python3 -m scripts.html_review_workbench.cli
working_directory: plugin_root
workflow:
  - attach-image
  - check-model
  - render
  - validate
  - preview
